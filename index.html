<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7ff">
  <title>Mission: Cosmic Quiz — Orbit Academy</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #edf3f8;
      --surface: #fbfdff;
      --ink: #172a3d;
      --muted: #52697d;
      --line: #bdcdda;
      --accent: #087f9c;
      --accent-soft: #e0f3f6;
      --focus: #00566d;
      --correct: #117653;
      --correct-soft: #e2f5eb;
      --wrong: #b3334b;
      --wrong-soft: #fff0f1;
      --grid: rgba(36, 102, 132, .055);
      --shadow: 0 26px 72px rgba(24, 53, 76, .17);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #080e17;
        --surface: #101c29;
        --ink: #e9f4f7;
        --muted: #a5bac6;
        --line: #2b4352;
        --accent: #56d8e9;
        --accent-soft: #17333d;
        --focus: #6ee7f7;
        --correct: #64dca5;
        --correct-soft: #18392f;
        --wrong: #ff8291;
        --wrong-soft: #422630;
        --grid: rgba(104, 198, 219, .055);
        --shadow: 0 28px 80px rgba(0, 0, 0, .42);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(41, 167, 193, .13), transparent 34%),
        radial-gradient(ellipse at 88% 85%, rgba(143, 177, 86, .11), transparent 32%),
        var(--page);
      color: var(--ink);
      font: 400 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px;
      content: "";
      pointer-events: none;
    }

    button { font: inherit; }

    .quiz {
      position: relative;
      width: min(100%, 560px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .quiz::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      background:
        linear-gradient(var(--accent), var(--accent)) left 17px top 0 / 30px 2px no-repeat,
        linear-gradient(var(--accent), var(--accent)) right 17px bottom 0 / 30px 2px no-repeat;
      content: "";
      pointer-events: none;
    }

    .topline {
      height: 6px;
      background: linear-gradient(90deg, #087f9c, #56d8e9 55%, #c5a650);
    }

    .content {
      padding: clamp(24px, 6vw, 42px);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 19px;
      letter-spacing: 0;
      box-shadow: inset 0 0 12px color-mix(in srgb, var(--accent), transparent 90%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font: 700 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 35px);
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    #page-title {
      position: relative;
      isolation: isolate;
    }

    #page-title::before {
      position: absolute;
      z-index: -1;
      inset: -6px -4px;
      background:
        radial-gradient(circle, var(--accent) 0 1px, transparent 1.5px) 2px 3px / 47px 31px,
        radial-gradient(circle, var(--accent) 0 1.2px, transparent 1.7px) 22px 14px / 83px 41px;
      opacity: .32;
      pointer-events: none;
      content: "";
    }

    .intro {
      max-width: 410px;
      margin: 13px 0 26px;
      color: var(--muted);
      font-size: 15px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      color: var(--muted);
      font: 650 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .score { color: var(--ink); white-space: nowrap; }
    .score strong { color: var(--accent); }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--line);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #087f9c, #56d8e9);
      transition: width 420ms cubic-bezier(.2, .8, .2, 1);
    }

    .question-block {     margin-top: 28px; }

    .question {
      min-height: 58px;
      margin: 0 0 19px;
      font-size: clamp(19px, 4vw, 21px);
      font-weight: 720;
      line-height: 1.38;
      letter-spacing: -.02em;
    }

    .answers {
      display: grid;
      gap: 9px;
    }

    .answer {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 55px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: color-mix(in srgb, var(--surface), var(--accent) 2%);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: inset 3px 0 var(--accent);
    }

    .answer:focus-visible, .primary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
      box-shadow: 0 0 0 2px var(--surface);
    }

    .answer:disabled { cursor: default; }

    .letter {
      display: grid;
      flex: 0 0 29px;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .answer.correct {
      border-color: var(--correct);
      background: var(--correct-soft);
      animation: pop 360ms ease both;
    }
    .answer.correct .letter { background: var(--correct); color: #fff; }
    .answer.wrong {
      border-color: var(--wrong);
      background: var(--wrong-soft);
      animation: shake 380ms ease both;
    }
    .answer.wrong .letter { background: var(--wrong); color: #fff; }
    .answer.reveal {
      border-color: var(--correct);
      background: var(--correct-soft);
    }
    .answer.reveal .letter { background: var(--correct); color: #fff; }

    .feedback {
      min-height: 26px;
      margin: 12px 0 0;
      padding: 4px 10px;
      border-left: 2px solid transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .feedback.good { border-color: var(--correct); color: var(--correct); }
    .feedback.bad { border-color: var(--wrong); color: var(--wrong); }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 13px;
    }

    .primary {
      min-height: 46px;
      padding: 0 19px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 720;
      cursor: pointer;
      box-shadow: 0 4px 0 color-mix(in srgb, var(--accent), #000 24%);
      transition: transform 150ms ease, filter 150ms ease, box-shadow 150ms ease;
    }
    .primary:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .primary:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent), #000 24%); }
    .primary[hidden] { display: none; }

    @media (forced-colors: active) {
      .answer:focus-visible, .primary:focus-visible {
        outline: 3px solid Highlight;
        box-shadow: none;
      }
    }

    .result {
      position: relative;
      isolation: isolate;
      padding: 14px 0 4px;
      text-align: center;
      animation: rise 480ms cubic-bezier(.2, .8, .2, 1) both;
    }
    .celebration::before {
      position: absolute;
      z-index: 0;
      top: -12px;
      right: -10px;
      left: -10px;
      height: 170px;
      background:
        radial-gradient(circle, #e5a839 0 2px, transparent 2.8px) 6% 21% / 10px 10px no-repeat,
        radial-gradient(circle, #40b9a2 0 2px, transparent 2.8px) 17% 56% / 10px 10px no-repeat,
        radial-gradient(circle, #ef6f6b 0 2px, transparent 2.8px) 29% 15% / 10px 10px no-repeat,
        radial-gradient(circle, #8675e8 0 2px, transparent 2.8px) 78% 18% / 10px 10px no-repeat,
        radial-gradient(circle, #40b9a2 0 2px, transparent 2.8px) 91% 48% / 10px 10px no-repeat,
        linear-gradient(45deg, transparent 35%, #e5a839 36% 68%, transparent 69%) 12% 66% / 7px 15px no-repeat,
        linear-gradient(45deg, transparent 35%, #8675e8 36% 68%, transparent 69%) 86% 60% / 7px 15px no-repeat,
        linear-gradient(45deg, transparent 35%, #ef6f6b 36% 68%, transparent 69%) 71% 8% / 7px 15px no-repeat;
      content: "";
      opacity: 0;
      pointer-events: none;
      animation: confetti-burst 1.4s ease-out .12s both;
    }
    .celebration > * { position: relative; z-index: 1; }

    .honors {
      width: fit-content;
      margin: -8px auto 18px;
      padding: 5px 11px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 60%);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font: 700 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .reaction {
      display: grid;
      width: 106px;
      height: 106px;
      margin: 0 auto 20px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--accent-soft);
      font-size: 58px;
      box-shadow: inset 0 0 28px color-mix(in srgb, var(--accent), transparent 90%);
      animation: pop 580ms cubic-bezier(.2, 1.4, .4, 1) both;
    }
    .celebration .reaction {
      border-color: color-mix(in srgb, var(--accent), transparent 40%);
      box-shadow:
        0 0 0 7px color-mix(in srgb, var(--accent), transparent 90%),
        inset 0 0 28px color-mix(in srgb, var(--accent), transparent 82%);
    }
    .result h1 { font-size: clamp(29px, 7vw, 38px); }
    .result-copy {
      max-width: 360px;
      margin: 12px auto 23px;
      color: var(--muted);
    }
    .final-score {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 25px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .final-score span { font-size: 14px; font-weight: 650; letter-spacing: 0; }
    .result .primary { display: block; min-width: 170px; margin: 0 auto; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes shake {
      15%, 55%, 85% { transform: translateX(-5px); }
      35%, 70% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }
    @keyframes pop {
      0% { transform: scale(.96); }
      55% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes confetti-burst {
      0% { opacity: 0; transform: translateY(-10px) scale(.8); }
      22% { opacity: .95; }
      100% { opacity: .35; transform: translateY(14px) scale(1.04); }
    }
    @keyframes title-stars-twinkle {
      from { opacity: .22; }
      to { opacity: .42; }
    }

    @media (prefers-reduced-motion: no-preference) {
      #page-title::before {
        animation: title-stars-twinkle 6s ease-in-out infinite alternate;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz" aria-labelledby="page-title">
    <div class="topline" aria-hidden="true"></div>
    <div class="content" id="app">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit Academy</div>
      <p class="eyebrow">Mission briefing</p>
      <h1 id="page-title">Mission: Cosmic Quiz</h1>
      <p class="intro">Ten questions, one little trip across the cosmos. How much do you know about our universe?</p>
      <div class="stats">
        <span id="question-count">Question 1 of 10</span>
        <span class="score">Score: <strong id="score">0</strong></span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        <div class="progress-fill"></div>
      </div>
      <section class="question-block" aria-live="polite">
        <h2 class="question" id="question" tabindex="-1"></h2>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="assertive"></p>
        <div class="actions">
          <button class="primary" id="next" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const questions = [
      { question: "Which planet is known as the Red Planet?", answers: ["Venus", "Mars", "Jupiter", "Mercury"], correct: 1, fact: "Mars looks red because its dusty surface is rich in iron oxide — basically rust." },
      { question: "What is the name of the galaxy we call home?", answers: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"], correct: 2, fact: "Our solar system lives in the Milky Way, a barred spiral galaxy." },
      { question: "Which planet has the most prominent ring system?", answers: ["Saturn", "Neptune", "Earth", "Uranus"], correct: 0, fact: "Saturn's rings are made mostly of countless pieces of ice and rock." },
      { question: "What is the closest star to Earth?", answers: ["Proxima Centauri", "Sirius", "The Sun", "Polaris"], correct: 2, fact: "The Sun is our closest star, about 150 million kilometers away." },
      { question: "Which planet is the largest in our solar system?", answers: ["Saturn", "Jupiter", "Neptune", "Earth"], correct: 1, fact: "Jupiter is so large that more than 1,300 Earths could fit inside it." },
      { question: "What do astronauts wear to protect themselves in space?", answers: ["A flight suit", "A pressure suit", "A wetsuit", "A thermal blanket"], correct: 1, fact: "A spacesuit provides oxygen and pressure, and helps regulate temperature." },
      { question: "Which object is at the center of our solar system?", answers: ["The Moon", "Earth", "Jupiter", "The Sun"], correct: 3, fact: "The Sun's gravity keeps the planets and other solar-system objects in orbit." },
      { question: "What is a rocky object that orbits the Sun, mostly between Mars and Jupiter?", answers: ["A comet", "An asteroid", "A meteor", "A moon"], correct: 1, fact: "Most asteroids orbit in the asteroid belt between Mars and Jupiter." },
      { question: "Which planet is famous for its Great Dark Spot storms?", answers: ["Neptune", "Mercury", "Venus", "Mars"], correct: 0, fact: "Neptune's atmosphere has powerful winds and giant storms that can appear and fade." },
      { question: "What is the first human-made object to reach interstellar space?", answers: ["Apollo 11", "Voyager 1", "Hubble", "Sputnik 1"], correct: 1, fact: "Voyager 1 launched in 1977 and entered interstellar space in 2012." }
    ];

    const app = document.getElementById("app");
    const questionCount = document.getElementById("question-count");
    const scoreDisplay = document.getElementById("score");
    const progress = document.querySelector('[role="progressbar"]');
    const progressFill = document.querySelector(".progress-fill");
    const questionTitle = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next");
    let current = 0;
    let score = 0;
    let locked = false;

    function renderQuestion() {
      const item = questions[current];
      locked = false;
      questionCount.textContent = `Question ${current + 1} of ${questions.length}`;
      questionTitle.textContent = item.question;
      answersElement.replaceChildren();
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
        button.addEventListener("click", () => chooseAnswer(index, button));
        answersElement.append(button);
      });
    }

    function chooseAnswer(index, selected) {
      if (locked) return;
      locked = true;
      const item = questions[current];
      const correct = index === item.correct;
      answersElement.querySelectorAll(".answer").forEach(button => { button.disabled = true; });
      if (correct) {
        score++;
        scoreDisplay.textContent = score;
        selected.classList.add("correct");
        feedback.textContent = `That's right! ${item.fact}`;
        feedback.classList.add("good");
      } else {
        selected.classList.add("wrong");
        answersElement.children[item.correct].classList.add("reveal");
        feedback.textContent = `Not quite. ${item.fact}`;
        feedback.classList.add("bad");
      }
      progress.setAttribute("aria-valuenow", String(current + 1));
      progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;
      nextButton.textContent = current === questions.length - 1 ? "See my results" : "Next question →";
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      const percentage = score / questions.length;
      const celebration = score >= 8;
      const reaction = celebration ? "🚀" : percentage >= .4 ? "🪐" : "🌱";
      const headline = percentage === 1 ? "Out of this world!" : percentage >= .7 ? "Stellar work!" : percentage >= .4 ? "Nice exploring!" : "Keep reaching for the stars!";
      const honors = celebration ? '<p class="honors">✦ Flight honors unlocked</p>' : "";
      const message = percentage === 1
        ? "A perfect mission! You really know your way around the cosmos."
        : percentage >= .7
          ? "You know a lot about the universe. Your next mission is waiting!"
          : percentage >= .4
            ? "You discovered some cosmic facts. There's always more to explore!"
            : "Every great explorer starts somewhere. Try again and see what you discover!";
      app.innerHTML = `
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit Academy</div>
        <section class="result${celebration ? " celebration" : ""}" aria-live="polite">
          <div class="reaction" aria-hidden="true">${reaction}</div>
          <p class="eyebrow">Mission complete</p>
          <h1>${headline}</h1>
          <p class="result-copy">${message}</p>
          ${honors}
          <div class="final-score">${score}<span>out of ${questions.length} correct</span></div>
          <button class="primary" id="restart" type="button">Explore again <span aria-hidden="true">↻</span></button>
        </section>`;
      document.getElementById("restart").addEventListener("click", restart);
      document.getElementById("restart").focus();
    }

    function restart() {
      location.reload();
    }

    nextButton.addEventListener("click", () => {
      if (current === questions.length - 1) {
        showResults();
      } else {
        current++;
        renderQuestion();
        questionTitle.focus();
      }
    });

    renderQuestion();
  </script>
</body>
</html>
